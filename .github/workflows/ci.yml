name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: jobs only read the repo. Elevate per-job if ever needed.
permissions:
  contents: read

env:
  # Opt JS actions (checkout, github-script, gitleaks) into Node 24 — Node 20 is
  # deprecated on the runners. Remove once Node 24 is the default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CCACHE_DIR: ${{ github.workspace }}/.ccache

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        preset: [debug, release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja + ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache pkg-config

      - name: Install Ninja + ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache pkg-config

      # Dependencies are vendored from source by CMake FetchContent (no package
      # manager). Cache the ccache dir so the dep + project recompiles are fast
      # across runs; the shallow git fetches themselves are cheap.
      - name: ccache cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/dependencies.cmake') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('cmake/dependencies.cmake') }}-
            ccache-${{ matrix.os }}-${{ matrix.preset }}-

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DDETR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Smoke + unit tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

      - name: Format check
        if: matrix.preset == 'debug' && runner.os == 'Linux'
        run: |
          sudo apt-get install -y clang-format-18
          find include src apps tests \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-18 --dry-run --Werror

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
