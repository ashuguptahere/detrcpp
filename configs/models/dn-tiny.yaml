# Tiny DN-DETR (DAB-DETR + denoising training) for fast smoke training / CI.
# The model reads the standard knobs; the dn_* knobs are train-side (DnConfig).
model: dn-detr
hidden_dim: 64
nheads: 4
enc_layers: 2
dec_layers: 2
dim_feedforward: 128
num_queries: 20
num_classes: 3
imgsz: 64
dn_number: 5
box_noise_scale: 0.4
label_noise_ratio: 0.2
