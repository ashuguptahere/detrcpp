# Tiny DINO for fast ONNX parity / CI. Full ResNet-50 backbone + 4 deformable
# levels + topk query selection. imgsz 64 -> Lv = 64+16+4+1 = 85 feature
# locations; num_queries (20) must be <= Lv for the topk selection.
model: dino
hidden_dim: 64
nheads: 8
enc_layers: 2
dec_layers: 2
dim_feedforward: 128
num_queries: 20
num_classes: 91
num_levels: 4
num_points: 4
imgsz: 64
