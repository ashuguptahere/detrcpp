# Tiny RF-DETR-CDN (RF-DETR + contrastive denoising training) for fast smoke / CI.
# Eval/inference is identical to rf-detr; the dn_* knobs are train-side (DnConfig,
# contrastive=true), reusing the shared deform-head CDN path.
model: rf-detr-cdn
vit_embed: 128
vit_depth: 2
vit_heads: 8
patch: 8
hidden_dim: 64
nheads: 8
dec_layers: 2
dim_feedforward: 128
num_queries: 30
num_classes: 3
num_levels: 3
num_points: 4
imgsz: 64
dn_number: 5
box_noise_scale: 1.0
label_noise_ratio: 0.5
contrastive: true
